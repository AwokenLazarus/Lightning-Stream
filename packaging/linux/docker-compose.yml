# Lightning Stream on a plain Linux machine: the same images as the Umbrel app, for an owner who runs
# their own XBT node and Lightning node (lnd-family) on this machine. A masking gateway comes with it,
# the Stream Gateway (DATUM-compatible, service "datum"); an owner may use their own DATUM Gateway instead.
#
# install.sh writes .env beside this file and starts it; docs/LINUX.md is the guide. Every service
# uses the host's network, so the app reaches the owner's node, Lightning node and own DATUM Gateway on
# 127.0.0.1, where they listen by default, and every port of the app is on 127.0.0.1 too, except:
#   * the gateway (selling port 8402): it listens beyond loopback only once the owner saves a shop
#     with an https:// address on the Sell page (the owner's reverse proxy or tunnel leads there);
#   * the hashmaker (profile "hashmaker", off unless LS_HASHMAKER=1): this machine's miners on 23340
#     (keep it on the LAN) and hashtakers' apps on 23341 (a port forward or tunnel makes it public);
#   * the built-in Stream relay (profile "relay", off unless LS_RELAY=1): public TCP 443 and UDP 7842,
#     on its own network (not the host's), and idle until the owner switches it on in the app.
#   * the VPN service (profile "vpn", off unless LS_VPN=1): UDP 51820 for the owner's devices'
#     WireGuard (keep it on the LAN), on its own network (not the host's);
#   * the AI endpoint (33540), only if the owner sets LS_AI_BIND to a LAN address in .env: programs
#     on the LAN then use AI sellers through it, each with a key made on the AI page.
# The UI asks for the password in .env (LS_UI_PASSWORD), set at install. Of the Lightning node's files
# the services mount only tls.cert; the admin macaroon reaches node-keys on standard input, once, and
# is never written (install.sh pipes it in). All state is in LS_DATA_DIR. The project's name, and so
# its containers' (lightning-stream-ui-1, ...), is COMPOSE_PROJECT_NAME in .env.

x-service: &service
  restart: unless-stopped
  init: true
  read_only: true
  network_mode: host
  tmpfs:
    - /tmp:rw,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    init:
      condition: service_completed_successfully

x-lightning-cert: &lightning-cert
  type: bind
  source: ${LS_LND_TLS_CERT:?set LS_LND_TLS_CERT in .env, the Lightning node's tls.cert}
  target: /data/lightning/tls.cert
  read_only: true
  bind:
    create_host_path: false

services:
  init:
    image: ghcr.io/awokenlazarus/xbt-init:0.1.0-b8a60adfece2@sha256:e18deaf67bfba78a90ea998055ca151843468a7f20177106b81124f5ae7fc60f
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      XBT_INIT_COMPONENTS: signer,witness,mcp,ui,gateway,hashrate,stream-relay,vpn,datum
      XBT_INIT_NODE_RPC_USER: ${LS_NODE_RPC_USER:?set LS_NODE_RPC_USER in .env, the XBT node's RPC user}
      XBT_INIT_NODE_RPC_PASS: ${LS_NODE_RPC_PASS:?set LS_NODE_RPC_PASS in .env, the XBT node's RPC password}
      XBT_INIT_UI_PASSWORD: ${LS_UI_PASSWORD:?set LS_UI_PASSWORD in .env, the app's login password}
      # the Stream Gateway's node login: init writes it as run/datum/rpc.cookie (user:password, 0600, its
      # user's) from the two RPC settings above, and makes run/datum/ (the UI writes, the gateway reads)
    volumes:
      - ${LS_DATA_DIR:?LS_DATA_DIR}:/data

  witness:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-anchor-witness:0.1.0-b8a60adfece2@sha256:2f8e006fe0938e1f125b5a03e05c8c7163009e888247345254ad9eec4216011b
    network_mode: none
    stop_grace_period: 30s
    volumes:
      - ${LS_DATA_DIR}/witness:/data/witness
      - ${LS_DATA_DIR}/run/anchor:/data/run/anchor

  signer:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-signer:0.1.0-b8a60adfece2@sha256:e495cebcd343e752fbe90499b4df0245db8dd5d153db4f8d62d75305375b51f0
    entrypoint: ["/usr/bin/xbt-supervise", "--watch", "/data/run/ln/rail.macaroon", "--watch", "/data/lightning/tls.cert", "--", "/usr/bin/xbt-signer"]
    stop_grace_period: 1m
    environment:
      XBT_NODE_RPC_HOST: ${LS_NODE_RPC_HOST:-127.0.0.1}
      XBT_NODE_RPC_PORT: ${LS_NODE_RPC_PORT:?set LS_NODE_RPC_PORT in .env, the XBT node's RPC port}
      # the chain is said, not asked of the node: the signer starts while the node is away, and says so
      XBT_CHAIN: ${LS_CHAIN:-main}
      B2_LN_REST: ${LS_LND_REST:?set LS_LND_REST in .env, the Lightning node's REST address like https://127.0.0.1:8080}
      B2_LN_MACAROON: /data/run/ln/rail.macaroon
      B2_MAINNET_ACK_FILE: /data/run/ln/mainnet-ack
      B2_LN_TLS_CERT: /data/lightning/tls.cert
      B2_STREAM_DIR: /data/run/signer/streams
      B2_ENROLL_CODE_COPY: /data/run/enroll/enroll-code
      # shops reached by key (no web address): their transport documents, written by the ui; the
      # signer reads them for callers that pass none (the AI address, agents)
      XBT_SHOPS_FILE: /data/run/shops/shops.json
    volumes:
      - ${LS_DATA_DIR}/signer:/data/signer
      - ${LS_DATA_DIR}/run/shops:/data/run/shops:ro
      - ${LS_DATA_DIR}/run/signer:/data/run/signer
      # the hashrate renter's own socket: the one way to the "hashrate" task's rental terms
      - ${LS_DATA_DIR}/run/rental:/data/run/rental
      - ${LS_DATA_DIR}/run/anchor:/data/run/anchor:ro
      - ${LS_DATA_DIR}/run/ln:/data/run/ln:ro
      - ${LS_DATA_DIR}/run/enroll:/data/run/enroll
      - *lightning-cert

  # agents on this machine: http://127.0.0.1:${LS_MCP_PORT}/mcp, behind the bearer token on the Agents page
  mcp:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-mcp:0.1.0-b8a60adfece2@sha256:c2eb8ae58baa7ee47548469d330a3ce16d16603010afbc2398a8013b3f273d57
    stop_grace_period: 30s
    environment:
      XBT_MCP_HTTP: 127.0.0.1:${LS_MCP_PORT:-33511}
      XBT_MCP_APPROVAL_WAIT_S: "300"
      XBT_MCP_LN: "1"
      XBT_MCP_TICKETS: "1"
      XBT_SHOPS_FILE: /data/run/shops/shops.json
    volumes:
      - ${LS_DATA_DIR}/mcp:/data/mcp
      - ${LS_DATA_DIR}/run/signer:/data/run/signer:ro
      - ${LS_DATA_DIR}/run/ui:/data/run/ui:ro
      - ${LS_DATA_DIR}/run/shops:/data/run/shops:ro

  ui:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-04de2e2f25e5@sha256:b4e8f5d7c3c541a8ce9745b42ae95339b02e38e5e3aadf8c99e089459de8fa7e
    stop_grace_period: 15s
    environment:
      # loopback only: from another machine, use an ssh tunnel (docs/LINUX.md)
      XBT_UI_BIND: 127.0.0.1:${LS_UI_PORT:-8482}
      # the Files folder, served to the shop's gateway on this machine only
      XBT_UI_FILES_BIND: 127.0.0.1:${LS_FILES_PORT:-8486}
      XBT_UI_PASSWORD_FILE: /data/ui/secrets/xbt-ui-password
      XBT_UI_SIGNER_SOCK: /data/run/signer/signer.sock
      XBT_UI_MCP_URL: http://127.0.0.1:${LS_MCP_PORT:-33511}/mcp
      XBT_UI_LN_REST: ${LS_LND_REST}
      XBT_UI_LN_TLS_CERT: /data/lightning/tls.cert
      XBT_UI_CONNECTOR: http://127.0.0.1:${LS_CONNECTOR_PORT:-8484}
      # a seller's own web page, opened inside the app: one origin per port, on the UI's own address (docs/SELLER-APPS.md)
      XBT_UI_APP_PORTS: ${LS_APP_PORTS:-33521,33522,33523,33524}
      XBT_UI_SELL: "1"
      XBT_UI_GW_PORT: ${LS_GW_PORT:-8402}
      XBT_UI_GW_NODE_REST: ${LS_LND_REST}
      XBT_UI_GW_NODE_TLS_CERT: /data/lightning/tls.cert
      XBT_UI_GW_HEALTH_URL: http://127.0.0.1:${LS_GW_PORT:-8402}/x402/ticket/health
      XBT_UI_SUGGESTED_SELLERS: ${LS_SUGGESTED_SELLERS:-npub1kqdrfmfg6mg52sy3ehu4vv7m3fjpa0830rhjdmvqrf09u3t3724q8cwr6a}
      XBT_UI_NOSTR_RELAYS: ${LS_RELAYS:-wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol}
      # the hashmaker's pages: set by install.sh only when LS_HASHMAKER=1
      XBT_UI_HASHER: ${LS_UI_HASHMAKER:-}
      XBT_UI_HASHER_SETTINGS: /data/run/hashrate/settings.json
      XBT_UI_HASHER_SLICES: ${LS_UI_HASHMAKER_SLICES:-}
      XBT_UI_HASHER_TOKEN_FILE: /data/run/hashrate/control-token
      XBT_UI_HASHRENT: http://127.0.0.1:${LS_HASHTAKER_CONTROL_PORT:-23343}
      XBT_UI_HASHRENT_TOKEN_FILE: /data/run/hashrate/control-token
      XBT_UI_ENROLL_CODE_FILE: /data/run/enroll/enroll-code
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      XBT_UI_RESTART_HINT: "in the folder you installed it to (~/lightning-stream unless you chose another), run: docker compose restart"
      # the built-in Stream relay's settings and status (Settings → Stream relays)
      XBT_UI_RELAY_DIR: /data/run/relay
      XBT_UI_RELAY_STATUS: /data/run/relay-status/status.json
      XBT_UI_VPN_DIR: /data/run/vpn
      XBT_UI_VPN_STATUS_DIR: /data/run/vpn-status
      # where the shop's gateway reaches the VPN service's tunnel endpoint (published on this machine's loopback only)
      XBT_UI_VPN_TUNNEL_UPSTREAM: http://127.0.0.1:${LS_VPN_TUNNEL_PORT:-51880}
      XBT_UI_VPN_ENDPOINT: ${LS_VPN_ENDPOINT:-}
      XBT_UI_RELAY_START_HINT: "in the folder you installed it to, run: docker compose --profile relay up -d (or run install.sh again and answer 1 to the relay)"
      # AI: the address programs use (served by the connector) and the files the AI page shares with it
      XBT_UI_AI_ENDPOINT: ${LS_AI_ADDRESS:-http://127.0.0.1:33540/v1}
      XBT_UI_AI_SELLERS: /data/run/ai/sellers.json
      XBT_UI_CREDENTIALS: /data/run/ai/credentials.json
      XBT_UI_AI_STATE: /data/run/ai/state.json
      # the Stream Gateway (Services → Hashrate → Your gateway): the UI writes its config.json (no secret in
      # it) into this dir, for this node, with the API on this port (stratum is 127.0.0.1:23339)
      XBT_UI_DATUM_DIR: /data/run/datum
      XBT_UI_DATUM_RPCURL: http://${LS_NODE_RPC_HOST:-127.0.0.1}:${LS_NODE_RPC_PORT}
      XBT_UI_DATUM_API_PORT: ${LS_DATUM_API_PORT:-7153}
    volumes:
      - ${LS_DATA_DIR}/ui:/data/ui
      - ${LS_DATA_DIR}/run/ai:/data/run/ai
      - ${LS_DATA_DIR}/run/signer:/data/run/signer:ro
      - ${LS_DATA_DIR}/run/ui:/data/run/ui
      - ${LS_DATA_DIR}/run/ln:/data/run/ln
      - ${LS_DATA_DIR}/run/gateway:/data/run/gateway
      - ${LS_DATA_DIR}/run/hashrate:/data/run/hashrate
      - ${LS_DATA_DIR}/run/shops:/data/run/shops
      - ${LS_DATA_DIR}/run/enroll:/data/run/enroll:ro
      - ${LS_DATA_DIR}/run/relay:/data/run/relay
      - ${LS_DATA_DIR}/run/relay-status:/data/run/relay-status:ro
      - ${LS_DATA_DIR}/run/vpn:/data/run/vpn
      - ${LS_DATA_DIR}/run/vpn-status:/data/run/vpn-status:ro
      - ${LS_DATA_DIR}/run/datum:/data/run/datum
      - *lightning-cert

  # One-shot, run by install.sh (`docker compose --profile setup run --rm -T node-keys < admin.macaroon`): has the
  # Lightning node bake the app's narrow macaroons, each under a root key of its own, from the admin
  # macaroon on standard input, and exits. It is not started by `up` (profile "setup").
  node-keys:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-04de2e2f25e5@sha256:b4e8f5d7c3c541a8ce9745b42ae95339b02e38e5e3aadf8c99e089459de8fa7e
    profiles: ["setup"]
    command: ["node-keys"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      XBT_KEYS_NODE_REST: ${LS_LND_REST}
      XBT_KEYS_TLS_CERT: /data/lightning/tls.cert
      XBT_KEYS_ADMIN: "-"
      XBT_KEYS_RAIL_DIR: /data/run/ln
      XBT_KEYS_GW_DIR: /data/run/gateway
    volumes:
      - ${LS_DATA_DIR}/run/ln:/data/run/ln
      - ${LS_DATA_DIR}/run/gateway:/data/run/gateway
      - *lightning-cert

  connector:
    <<: *service
    image: ghcr.io/awokenlazarus/lightning-stream:0.1.0-04de2e2f25e5@sha256:f032cd33a0909b94276d2fec8a2809d6583474318d18128e3f89c06c51bcfc53
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      signer:
        condition: service_started
    environment:
      B2_SIGNER_SOCK: /data/run/signer/signer.sock
      B2_STREAM_DIR: /data/run/signer/streams
      LS_TASK: default
      LS_MAX_SATS: "20000"
      LS_LISTEN: 127.0.0.1:${LS_CONNECTOR_PORT:-8484}
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      # the AI endpoint: loopback unless the owner sets LS_AI_BIND (0.0.0.0:33540 for the LAN); every
      # program needs a key from the AI page either way
      LS_AI_LISTEN: ${LS_AI_BIND:-127.0.0.1:33540}
      LS_CREDENTIALS: /data/run/ai/credentials.json
      LS_AI_SELLERS: /data/run/ai/sellers.json
      LS_AI_STATE: /data/run/ai/state.json
    volumes:
      - ${LS_DATA_DIR}/run/ai:/data/run/ai
      - ${LS_DATA_DIR}/run/signer:/data/run/signer:ro
      - ${LS_DATA_DIR}/run/signer/streams:/data/run/signer/streams
      - ${LS_DATA_DIR}/run/shops:/data/run/shops:ro

  # idle until the owner saves a shop on the Sell page, which writes run/gateway/config.json
  gateway:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-gateway:0.1.0-b8a60adfece2@sha256:c1969c9e93fb8bda6e481f11c71a4b099cbbe76faaea4ad0d458090068d31022
    stop_grace_period: 30s
    # probed at the port the Sell page gives the gateway (LS_GW_PORT), not the image's default 8402: a gateway on
    # another port was shown unhealthy forever
    healthcheck:
      test: ["CMD", "/usr/bin/xbt-supervise", "probe", "http://127.0.0.1:${LS_GW_PORT:-8402}/x402/ticket/health",
             "--waiting-for", "/data/run/gateway/config.json"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ${LS_DATA_DIR}/gateway:/data/gateway
      - ${LS_DATA_DIR}/run/gateway:/data/run/gateway:ro
      - *lightning-cert

  # The hashmaker: rents this machine's miners out (Sell → Hashrate). Only with LS_HASHMAKER=1.
  hashmaker:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-b8a60adfece2@sha256:5bc4b1fb7d5e666e70e66928d1e9994d06cd4db03079ebc0b8dba49d4a245c87
    profiles: ["hashmaker"]
    stop_grace_period: 15s
    command: ["hasher", "--key", "/data/hashrate/link.key", "--nostr-key", "/data/hashrate/nostr.key",
              "--miners", "0.0.0.0:23340", "--link", "0.0.0.0:23341", "--slices", "127.0.0.1:23344",
              "--control", "127.0.0.1:23342", "--control-token-file", "/data/run/hashrate/control-token",
              "--config", "/data/run/hashrate/settings.json", "--relays", "${LS_RELAYS:-wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol}",
              "--gateway", "http://127.0.0.1:${LS_GW_PORT:-8402}",
              "--miners-public", "${LS_LAN_HOST:-127.0.0.1}:23340", "--link-lan", "${LS_LAN_HOST:-127.0.0.1}:23341",
              "--report", "/data/hashrate/hasher.json"]
    volumes:
      - ${LS_DATA_DIR}/hashrate:/data/hashrate
      - ${LS_DATA_DIR}/run/hashrate:/data/run/hashrate:ro

  # The Stream Gateway (DATUM-compatible), the masking gateway that comes with the app: rented miners work
  # on its jobs, solo on the owner's XBT node or for Lazarus Pool, as set on Services → Hashrate. Each job
  # is masked with a key of the gateway's own, so a hashmaker can't tell which shares would be blocks and
  # keep those back; the hashtaker opens every job on the API's /xbt/job before a miner gets it. Both
  # ports are on loopback (stratum 23339; API LS_DATUM_API_PORT, 7153, not 7152, which an owner's own
  # gateway may hold), and /xbt/job and the dashboard answer loopback only (no admin password: every
  # admin endpoint refuses). The node is reached over RPC with the login init writes
  # (run/datum/rpc.cookie); no ZMQ: new blocks are found by polling the node. Idle until the UI writes
  # run/datum/config.json; a found block is also saved under LS_DATA_DIR/datum/submitblocks.
  datum:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-datum-gateway:0.1.0-b8a60adfece2@sha256:05aa9519c24e6b915ecbfdd45946367c6eda597af5474968a9814b7709b7585a
    stop_grace_period: 30s
    entrypoint: ["/usr/bin/xbt-supervise", "--wait", "/data/run/datum/config.json", "--watch", "/data/run/datum/rpc.cookie", "--",
                 "/usr/bin/xbt-datum-gateway", "-c", "/data/run/datum/config.json"]
    # probed at the port this install gives the API, not the image's default 7152
    healthcheck:
      test: ["CMD", "/usr/bin/xbt-supervise", "probe", "http://127.0.0.1:${LS_DATUM_API_PORT:-7153}/",
             "--waiting-for", "/data/run/datum/config.json"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ${LS_DATA_DIR}/datum:/data/datum
      - ${LS_DATA_DIR}/run/datum:/data/run/datum:ro

  # The hashtaker: rents other people's miners into a DATUM-protocol gateway (the one above unless the
  # owner chose their own: LS_DATUM_GATEWAY) and pays each piece of work through the signer, as the
  # "hashrate" task of the spending rules, on the renter's own socket (run/rental), which no other service
  # reaches and which the task's rental terms need. Every job is opened on LS_GATEWAY_API (or the API saved with a
  # gateway chosen on the page) and checked to be masked before a miner gets it; a rental to a gateway whose
  # jobs aren't is refused. LS_BUNDLED_GATEWAY is "off" when the owner chose their own gateway at install,
  # so the hashtaker keeps it rather than moving to the Stream Gateway.
  hashtaker:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-b8a60adfece2@sha256:5bc4b1fb7d5e666e70e66928d1e9994d06cd4db03079ebc0b8dba49d4a245c87
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      signer:
        condition: service_started
    command: ["renter", "--key", "/data/hashrate/renter.key", "--control", "127.0.0.1:${LS_HASHTAKER_CONTROL_PORT:-23343}",
              "--control-token-file", "/data/run/hashrate/control-token", "--state", "/data/hashrate",
              "--upstream", "${LS_DATUM:-127.0.0.1:23339}", "--gateway-api", "${LS_GATEWAY_API:-127.0.0.1:7153}",
              "--datum-candidates", "127.0.0.1:23339", "--bundled-gateway", "${LS_BUNDLED_GATEWAY:-127.0.0.1:23339}",
              "--user", "${LS_DATUM_USER:-rented}",
              "--relays", "${LS_RELAYS:-wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol}",
              "--signer", "/data/run/rental/signer.sock", "--task", "hashrate"]
    volumes:
      - ${LS_DATA_DIR}/hashrate:/data/hashrate
      - ${LS_DATA_DIR}/run/hashrate:/data/run/hashrate:ro
      - ${LS_DATA_DIR}/run/rental:/data/run/rental:ro

  # The built-in Stream relay (docs/RUN-A-RELAY.md): carries direct links between other people's apps
  # when their routers block a direct connection. Profile "relay": started only with LS_RELAY=1,
  # because it takes the machine's public port 443 (and UDP 7842). It runs on Docker's own network,
  # unprivileged (443 is mapped to 8443 inside), and does nothing until the owner switches it on under
  # Settings → Stream relays and its checks pass.
  stream-relay:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-stream-relay:0.1.0-b8a60adfece2@sha256:6072e539999b81e760367b1f9697c5680caaca74b8cd0fa7a367246dd56fefcc
    profiles: ["relay"]
    network_mode: bridge
    ports:
      - "443:8443"
      - "7842:7842/udp"
    stop_grace_period: 15s
    environment:
      XBT_RELAY_SETTINGS: /data/run/relay/relay.json
      XBT_RELAY_STATUS: /data/run/relay-status/status.json
      XBT_RELAY_STATE: /data/stream-relay
    volumes:
      - ${LS_DATA_DIR}/stream-relay:/data/stream-relay
      - ${LS_DATA_DIR}/run/relay:/data/run/relay:ro
      - ${LS_DATA_DIR}/run/relay-status:/data/run/relay-status

  # The VPN service (docs/VPN-EXITS.md): the WireGuard endpoint the owner's devices pair with (UDP
  # 51820, LS_VPN_PORT), and this box's exit if the owner offers one on the VPN page. Profile "vpn":
  # started only with LS_VPN=1. Userspace WireGuard and TCP/IP: no TUN device and no capabilities. It
  # runs on Docker's own network, so the exit never reaches this machine's own services, and restarts
  # itself when the owner changes the devices or the exit. Exits are found on, and an offered exit is
  # announced to, the Nostr relays of LS_RELAYS; an exit is announced only with its country set
  # (LS_VPN_REGION, two letters).
  vpn:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-vpn:0.1.0-b8a60adfece2@sha256:12ca342eace8708dedf99c4d3cd9be3da98a3ef9459b1bd7e2c8efa55e4bd5a1
    profiles: ["vpn"]
    network_mode: bridge
    ports:
      - "${LS_VPN_PORT:-51820}:51820/udp"
      # the exit's tunnel endpoint, for the shop's gateway on this machine only
      - "127.0.0.1:${LS_VPN_TUNNEL_PORT:-51880}:51880/tcp"
    stop_grace_period: 10s
    environment:
      XBT_VPN_NOSTR_RELAYS: ${LS_RELAYS:-wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol}
      XBT_VPN_REGION: ${LS_VPN_REGION:-}
      # priced exits are paid through the owner's wallet: its socket, and the dir paid tunnels are streamed through
      B2_SIGNER_SOCK: /data/run/signer/signer.sock
      B2_STREAM_DIR: /data/run/signer/streams
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      XBT_VPN_TUNNEL_LISTEN: 0.0.0.0:51880
    volumes:
      - ${LS_DATA_DIR}/vpn:/data/vpn
      - ${LS_DATA_DIR}/run/vpn:/data/run/vpn:ro
      - ${LS_DATA_DIR}/run/vpn-status:/data/run/vpn-status
      - ${LS_DATA_DIR}/run/signer:/data/run/signer:ro
      - ${LS_DATA_DIR}/run/signer/streams:/data/run/signer/streams
      - ${LS_DATA_DIR}/run/shops:/data/run/shops:ro
