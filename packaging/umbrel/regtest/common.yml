# Off-Umbrel overlay shared by every app (the Umbrel regtest run). umbrelOS injects app_proxy and puts every
# app on umbrel_main_network; here the network is the Lightning lab's (UMBREL_TEST_NET: the XBT node and the
# Lightning Fork nodes are on it, as Paul's apps are on a box's), and app_proxy is the test driver's reverse
# proxy on the host (it sets X-Forwarded-* as app_proxy does), so the service is not run.
networks:
  default:
    name: ${UMBREL_TEST_NET}
    external: true

services:
  app_proxy:
    image: debian:bookworm-slim
    profiles: ["umbrel-only"]
