manifestVersion: 1.1
id: lazarus-xbt-agent-wallet
category: finance
name: XBT Agent Wallet
version: "0.1.0"
tagline: A spending-limited XBT wallet for your AI agents, with a policy you sign
description: >-
  Give your AI agents a wallet they can pay with, and keep the keys and the rules to yourself. Agents
  connect to the wallet's MCP server and can only pay what your policy allows, within its budgets.
  Anything above your threshold waits for you to approve it here, signed with a key that stays in
  your browser. The wallet pays services over XBT Lightning with stream tickets, through your
  Lightning Fork node.


  Setup, in this app's pages: enrol your approval key, sign a policy (the starter template turns
  Lightning and stream tickets on with low caps), and on the Lightning page paste a macaroon you make
  in Lightning Fork's dashboard with exactly info:read, offchain:read, offchain:write and
  onchain:read. The app reads only the node's certificate; it never holds an admin macaroon.


  The keys stay in the signer, sealed on this box's disk. A separate anchor witness keeps a tamper
  record of every signature. On mainnet this software moves real funds and has run on regtest only:
  the Lightning page asks you to acknowledge that before it stores a macaroon.


  Needs Lightning Fork and an XBT (BLAKE2b) node. Side-load only, from a community store you add; the
  images are the project's published ones, pinned by digest.
developer: Lazarus
website: https://github.com/AwokenLazarus/Lightning-Stream
repo: https://github.com/AwokenLazarus/Lightning-Stream
support: https://github.com/AwokenLazarus/Lightning-Stream/issues
port: 8480
gallery:
  - https://raw.githubusercontent.com/AwokenLazarus/Lightning-Stream/main/packaging/umbrel/lazarus-xbt-agent-wallet/1.png
  - https://raw.githubusercontent.com/AwokenLazarus/Lightning-Stream/main/packaging/umbrel/lazarus-xbt-agent-wallet/2.png
  - https://raw.githubusercontent.com/AwokenLazarus/Lightning-Stream/main/packaging/umbrel/lazarus-xbt-agent-wallet/3.png
releaseNotes: >-
