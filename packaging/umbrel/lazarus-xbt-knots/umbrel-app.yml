manifestVersion: 1.1
id: lazarus-xbt-knots
category: bitcoin
name: XBT Node (stand-in)
version: "29.4.2-agp040.1"
tagline: A pruned XBT (BLAKE2b) Knots node for the XBT apps on this box
description: >-
  A pruned Bitcoin Knots 29.4.2 node on the XBT (BLAKE2b) chain, with exclusive BLAKE2b peers. It
  fills the bitcoin node slot the XBT Agent Wallet depends on, as a fallback: on a box that already
  runs Knots (BLAKE2b) Companion, the node Lightning Fork uses, select that one instead.


  Opening the app shows the node's chain status (Knots' read-only REST endpoint).


  Unpublished and side-load only. Its image (xbt-a3-knots:29.4.2) stays local.
developer: Lazarus
website: https://github.com/AwokenLazarus/Lightning-Stream
repo: https://github.com/AwokenLazarus/Lightning-Stream
support: https://github.com/AwokenLazarus/Lightning-Stream/issues
port: 8342
path: "/rest/chaininfo.json"
gallery: []
releaseNotes: >-
  Local stand-in for the XBT node slot.
dependencies: []
# the slot the wallet depends on; it exports APP_XBT_KNOTS_*, which the wallet reads when no slot value is set
implements:
  - bitcoin
defaultUsername: ""
defaultPassword: ""
submitter: Lazarus
submission: https://github.com/AwokenLazarus/Lightning-Stream/tree/main/packaging/umbrel
icon: https://raw.githubusercontent.com/AwokenLazarus/Lightning-Stream/main/packaging/umbrel/lazarus-xbt-knots/icon.svg
