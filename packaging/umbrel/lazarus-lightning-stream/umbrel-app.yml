name: Lightning Stream
version: "0.1.11"
tagline: Buy and sell any service over Lightning from this box, paid as you use it
description: >-
  One app for both sides. The wallet pays sellers with stream tickets under a policy you sign, and
  agents connect to its MCP server. The connector, on this box only, asks the signer to pay for what
  a service sends (a stream, a file, a reply) as it arrives. The sell side is the gateway: it stays idle until you add a service on the
  Sell page, and it holds only the narrow macaroons the app makes for it. The signer is the only
  service that can spend.


  Setup takes a few minutes and no keys to copy. The app connects to this box's Lightning node by
  itself: a one-shot service asks the node to make the app's own narrow keys (it can pay only within
  your spending rules, and the selling side can only ask for payments), each revocable alone in the
  node's app. You open the app from your Umbrel dashboard and log in with the app password Umbrel
  shows for it (its default credentials). Then make your approval
  key in the browser (download its backup), confirm that the app pays with real money, and sign the
  starter spending rules.


  To sell, open Sell: name your shop, say where buyers find you (an https address; the page explains
  Cloudflare Tunnel, another tunnel app or your own proxy), and add each service you sell: the page lists
  media servers and AI models it finds on this box. To buy, add a seller on Services and allow it to be
  paid with one signature. Agents on the LAN use port 33511, with the bearer token from the Agents page.


  The keys stay in the signer, sealed on this box's disk. A separate anchor witness keeps a tamper
  record of every signature. On mainnet this software moves real funds and has run on regtest only:
  the Lightning page asks you to acknowledge that before it stores a macaroon.


  Uninstalling removes the app's files, but the keys it made stay valid on your Lightning node
  until you revoke them. Before you uninstall, note the root key ids on the app's Your node page
  (under Details), then delete them in Lightning Fork (or with `lncli deletemacaroonid <id>`).


  Needs Lightning Fork and an XBT (BLAKE2b) node.
