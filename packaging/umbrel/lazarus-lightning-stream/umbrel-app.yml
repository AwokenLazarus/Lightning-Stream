id: lazarus-lightning-stream
category: lightning
name: Lightning Stream
version: "0.1.0"
tagline: Buy and sell over Lightning from this box, and play what you pay for
description: >-
  One app for both sides. The wallet pays sellers with stream tickets under a policy you sign, and
  agents connect to its MCP server. The connector, on this box only, asks the signer to pay for a
  film and stream it. The sell side is the gateway: it stays idle until you add a service on the
  Sell page, and it holds only the narrow macaroons that page writes. The signer is the only
  service that can spend.


  Setup, on this app's main page: enrol your approval key, sign a policy (the starter template turns
  Lightning and stream tickets on with low caps), and on the Lightning page paste a macaroon you make
  in Lightning Fork's dashboard with exactly info:read, offchain:read, offchain:write and
  onchain:read. The app reads only the node's certificate; it never holds an admin macaroon.


  To sell, open the Sell page: connect your Lightning node once (two macaroons: invoices:read
  invoices:write; info:read), say where buyers find you, and add each service you sell (a media
  server, an AI model, another web service) with its address on this box and a price in sats.
  Buyers reach the gateway through an https proxy you point at lazarus-lightning-stream_gateway_1:8402.
  Until a service is saved, the gateway does not listen. To buy from a seller, paste its address on
  the Services page. Agents on the LAN use port 33511, with the bearer token from the Agents page.


  The keys stay in the signer, sealed on this box's disk. A separate anchor witness keeps a tamper
  record of every signature. On mainnet this software moves real funds and has run on regtest only:
  the Lightning page asks you to acknowledge that before it stores a macaroon.


  Needs Lightning Fork and an XBT (BLAKE2b) node. Side-load only. The connector image is the local
  tag lightning-stream:0.1.0 until it is published; the other images are pinned by digest.
