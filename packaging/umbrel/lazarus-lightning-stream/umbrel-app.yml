releaseNotes: >-
  0.1.11: signing the safe starter rules now turns paying on (before, a new install could not). The
  first run speaks plainly: the rules review lists each change in a sentence with its unit, Home and
  Your node agree on whether the node is connected, the approval key's backup step says up front what
  it needs, and an app with nothing to sell yet shows as healthy. Your node lists the keys to revoke
  on the node before an uninstall.
  0.1.10: a spending limit is now a hard cap, routing fees included: when the next ticket would go
  over it, nothing more is paid. Buyers can ask for smaller tickets (down to 546 sats) to fit their
  limit, and your shop sells them. Listings keep working when sellers add new kinds of service: an
  app shows the services it knows and leaves out the rest.
  0.1.9: an update's changes to what your shop lists take effect when the app starts, without
  pressing Save on Sell.
  0.1.8: hashrate is listed beside your other services when you rent out your miners, and Browse has
  a Hashrate category that leads to Rent hashrate. Sell, Hashrate explains how to give renters an
  address (forward TCP port 23341 to the box), and a new address is published within a minute.
  0.1.7: your hashrate offer goes on public listings only once you give the address renters use to reach
  your miners (Sell, Hashrate; it needs a port forward or a tunnel), and is published again only when
  what you offer changes, not with every wobble of the measured hashrate.
  0.1.6: rent out this box's miners and rent other people's (Sell and Services, Hashrate): idle miners
  hash for your own pool, each rental takes whole miners and pays per piece of work.
  0.1.5: the app no longer skips its password for a peer named like the box's login proxy (umbrelOS
  2.0 runs no such container, so another app could have taken the name); log in with the app password
  Umbrel shows for this app.
  0.1.4: no setup to connect your Lightning node (the app makes its own narrow keys through the node),
  the app password shown on the app's page in the Umbrel dashboard, no codes to read from logs, an approval
  key backup you can download, "Allow this seller" in one signature, services on this box offered on
  the Sell page, help with an https address, a player that says why something does not play, and a
  free preview of your own shop (a box cannot buy from itself).


  0.1.3: a calmer river (near the pointer the streams brighten and ease aside; a click sends a pulse
  along one), no flash between pages, a top bar the page scrolls under, and adding a seller that
  prices each item separately works.


  0.1.2: the Services page can read sellers' signed listings from two public Nostr relays (opt-in).


  0.1.1: the app is laid out for any service (media, AI models, other web services), in plain words,
  with five places (Services, Sell, Wallet, Apps & agents, Settings) and a new look. Selling and the
  Services page are part of the main page; the separate sell page is gone.


  0.1.0: the wallet, the connector and the gateway in one app. The connector image is a local build.
  The gateway does not listen until its page is saved. Local package, regtest-tested only for the
  two apps this one is built from.
