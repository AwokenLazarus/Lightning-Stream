# Lightning Stream. Unpublished: side-load only. The wallet's services, the connector and the gateway.
# Buy: the signer, the anchor witness, the MCP server and the web UI, as in the wallet app. The main
# page is this app's own page (port 8482). Agents on the LAN use host port 33511.
# AI: the connector also serves an OpenAI-compatible endpoint on host port 33540 for programs on the
# LAN; each needs a key the owner makes on the AI page, with its own limit (run/ai, shared by group).
# Play: the connector pays through the signer and streams the body. It is not published on the LAN.
# It shares the UI's network namespace and listens on 127.0.0.1:8484, which is what XBT_UI_CONNECTOR
# names. A browser on another machine cannot open that address. The UI process, in that namespace, can.
# Sell: the gateway, the same image as the gateway app, so it stays idle until its config exists
# (xbt-supervise --wait). The owner turns it on from the Sell page of the app's own page
# (XBT_UI_SELL=1), which writes the gateway's config and its two narrow macaroons. The gateway mounts
# only those. The signer is the only service that can spend. Of the Lightning node's data the
# services mount only tls.cert; the one-shot node-keys-bake alone reads its admin macaroon, to have
# the node bake the narrow macaroons (below), and keeps nothing of it.
#
# Hashrate: two services of the xbt-hashlink image, as xbt-hashrate. The hasher takes this box's
# miners on host port 23340 (LAN) and renters' apps on 23341, which needs a port forward or a tunnel
# (the owner writes that public address on Sell → Hashrate; without it no listing goes to public relays)
# to be reached from outside. Until the owner turns renting on (Sell → Hashrate, which writes
# run/hashrate/settings.json), it publishes nothing and lets miners that connect go. A miner nobody
# rents hashes for the owner's own pool. Renters pay each piece of work through this app's gateway,
# under /hashrate/; the gateway passes it to the hasher on 23344, which is not published. The renter
# rents other people's miners into the owner's own DATUM Gateway and pays through the signer, as the
# "hashrate" task of the spending rules. It is in the signer's group for the socket. Both control
# pages (23342, 23343) are reached by the UI only, with the token init makes in run/hashrate/. The
# image has no published digest yet: it is the local tag scripts/oci_build.sh --load gives.
#
# Stream Gateway (DATUM-compatible): the renter's own gateway, the `datum` service, in the renter's
# network namespace. Every rented job is masked with this gateway's key, and the renter checks each job on
# the gateway's /xbt/job before a miner gets it. Stratum 127.0.0.1:23339 and the API 127.0.0.1:7152 are
# on the renter's loopback only: no other container and nothing on the LAN reaches them, and no host port
# is published. It talks to the node over RPC alone (no ZMQ: new blocks come from polling), with the
# cookie init writes in run/datum from the node's RPC user and password. It stays idle until the UI's
# Hashrate page ("Your gateway") writes run/datum/config.json (solo to the owner's address, or Lazarus),
# which holds no secret. Found blocks are also kept in datum/submitblocks. The image has no published
# digest yet: it is the local tag oci_build.sh --load gives (xbt-datum-gateway:0.1.0).
#
# Stream sockets live in run/signer/streams (B2_STREAM_DIR for the signer and the connector). The
# connector runs as the signer's user, because the published signer image cannot gain a group until
# it is rebuilt. It mounts that directory read-write and the rest of run/signer read-only, and it
# does not mount the signer's state. A fresh data dir arrives owned by the box user, so init's chown
# of run/signer covers the subdirectory. The connector image has no published digest yet: it is the
# local tag scripts/oci_build.sh --load gives (lightning-stream:0.1.0). The other images are pinned.
version: "3.7"

x-service: &service
  restart: on-failure
  # a static binary as PID 1 gets no default action for SIGTERM: without an init, a stop waits out the
  # grace period and kills the service (umbrelOS stops and restarts apps with SIGTERM)
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    init:
      condition: service_completed_successfully

x-lightning-data: &lightning-data
  # the Lightning node's data folder, read-only: mounted into node-keys-bake only, which runs as the
  # Lightning app's user (1000) because its directories are that user's alone (0700). The folder
  # always exists (tls.cert is in it); the admin macaroon in it appears when the owner makes the wallet,
  # which a mount of that one file could not wait for (Docker refuses to start on a missing file)
  type: bind
  source: ${APP_LIGHTNING_FORK_NODE_DATA_DIR}
  target: /node
  read_only: true
  bind:
    create_host_path: false

x-lightning-cert: &lightning-cert
  type: bind
  source: ${APP_LIGHTNING_FORK_NODE_DATA_DIR}/tls.cert
  target: /data/lightning/tls.cert
  read_only: true
  bind:
    # a missing certificate stops the start: Docker would otherwise make a directory in its place
    create_host_path: false

services:
  app_proxy:
    environment:
      APP_HOST: lazarus-lightning-stream_ui_1
      APP_PORT: 8482

  init:
    image: ghcr.io/awokenlazarus/xbt-init:0.1.0-b8a60adfece2@sha256:e18deaf67bfba78a90ea998055ca151843468a7f20177106b81124f5ae7fc60f
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      XBT_INIT_COMPONENTS: signer,witness,mcp,ui,gateway,hashrate,vpn,datum
      XBT_INIT_NODE_RPC_USER: ${APP_BITCOIN_RPC_USER:-${APP_XBT_KNOTS_RPC_USER}}
      XBT_INIT_NODE_RPC_PASS: ${APP_BITCOIN_RPC_PASS:-${APP_XBT_KNOTS_RPC_PASS}}
      XBT_INIT_UI_PASSWORD: ${APP_PASSWORD}
      # run/node-keys: the hand-over of the keys node-keys-bake (the Lightning app's user) has the node bake
      XBT_INIT_NODE_KEYS_UID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  witness:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-anchor-witness:0.1.0-c8ba24a813dc@sha256:c4b8e7ec74f880ee71436edb057ed8ba117929bbeb415ac2ffc19debb92d7f68
    network_mode: none
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/witness:/data/witness
      - ${APP_DATA_DIR}/data/run/anchor:/data/run/anchor

  signer:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-signer:0.1.0-c8ba24a813dc@sha256:e421803110285fe778987312e9cb27bacb498ab7ff5208aa0eeaad250c5a12ce
    entrypoint: ["/usr/bin/xbt-supervise", "--watch", "/data/run/ln/rail.macaroon", "--watch", "/data/lightning/tls.cert", "--", "/usr/bin/xbt-signer"]
    stop_grace_period: 1m
    environment:
      XBT_NODE_RPC_HOST: ${APP_BITCOIN_NODE_IP:-${APP_XBT_KNOTS_NODE_HOST}}
      XBT_NODE_RPC_PORT: ${APP_BITCOIN_RPC_PORT:-${APP_XBT_KNOTS_RPC_PORT}}
      # the stand-in names its chain; with the slot's node the signer reads it from the node
      XBT_CHAIN: ${APP_XBT_KNOTS_CHAIN:-}
      B2_LN_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      B2_LN_MACAROON: /data/run/ln/rail.macaroon
      B2_MAINNET_ACK_FILE: /data/run/ln/mainnet-ack
      B2_LN_TLS_CERT: /data/lightning/tls.cert
      # the same directory the connector binds stream sockets in
      B2_STREAM_DIR: /data/run/signer/streams
      # a copy of the one-time enrolment code for the setup page (run/enroll: the signer and the UI only)
      B2_ENROLL_CODE_COPY: /data/run/enroll/enroll-code
      # shops reached by key: read for callers that pass no transport document (the AI address, agents)
      XBT_SHOPS_FILE: /data/run/shops/shops.json
    volumes:
      - ${APP_DATA_DIR}/data/signer:/data/signer
      - ${APP_DATA_DIR}/data/run/shops:/data/run/shops:ro
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer
      # the hashrate renter's own socket: the one way to the "hashrate" task's rental terms
      - ${APP_DATA_DIR}/data/run/rental:/data/run/rental
      - ${APP_DATA_DIR}/data/run/anchor:/data/run/anchor:ro
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln:ro
      - ${APP_DATA_DIR}/data/run/enroll:/data/run/enroll
      - *lightning-cert

  mcp:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-mcp:0.1.0-c8ba24a813dc@sha256:556e7098323602ce1b6b699cfb299050e27276b954f3a7eecbb18e0499641d45
    stop_grace_period: 30s
    environment:
      # an over-threshold payment waits this long for the owner's approval in the UI
      XBT_MCP_APPROVAL_WAIT_S: "300"
      # the Lightning rail's and the tickets' own tools (status, stop) beside xbt402_pay
      XBT_MCP_LN: "1"
      XBT_MCP_TICKETS: "1"
      XBT_SHOPS_FILE: /data/run/shops/shops.json
    ports:
      # agents on the LAN. 33510 is the wallet app's host port, so this app uses 33511.
      # other apps on this box use lazarus-lightning-stream_mcp_1:33510, behind the bearer token
      - "33511:33510"
    volumes:
      - ${APP_DATA_DIR}/data/mcp:/data/mcp
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the bearer token is the UI's file (0640, group xbt-wallet-ui): read on every request, never written here
      - ${APP_DATA_DIR}/data/run/ui:/data/run/ui:ro

  ui:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-d43386c2da47@sha256:6231aef23717b7c8051e706c52fddf598061e2d94a56aab9e29a2af19713009d
    stop_grace_period: 15s
    ports:
      # sellers' own web pages, framed by the app's page on the same host (umbreld proxies the page itself)
      - "33521:33521"
      - "33522:33522"
      - "33523:33523"
      - "33524:33524"
      # the AI endpoint for programs on the LAN (served by the connector, which shares this container's
      # network): every request needs a key the owner made on the AI page
      - "33540:33540"
    environment:
      XBT_UI_BIND: 0.0.0.0:8482
      XBT_UI_PASSWORD_FILE: /data/ui/secrets/xbt-ui-password
      XBT_UI_SIGNER_SOCK: /data/run/signer/signer.sock
      XBT_UI_MCP_URL: http://${DEVICE_DOMAIN_NAME}:33511/mcp
      XBT_UI_LN_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_UI_LN_TLS_CERT: /data/lightning/tls.cert
      # node-keys-bake brings the app's keys once the owner has made the wallet in Lightning Fork
      XBT_UI_LN_AUTO: "1"
      # the connector shares this container's network namespace and listens on loopback only
      XBT_UI_CONNECTOR: http://127.0.0.1:8484
      # a seller's own web page, opened inside the app: one origin per port (docs/SELLER-APPS.md). A
      # port serves nothing without the visit's cookie, which only the owner's page hands out
      XBT_UI_APP_PORTS: "33521,33522,33523,33524"
      # Sell: the gateway's setup on this page, as the gateway's container sees the node and the paths
      XBT_UI_SELL: "1"
      XBT_UI_GW_NODE_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_UI_GW_NODE_TLS_CERT: /data/lightning/tls.cert
      XBT_UI_GW_HEALTH_URL: http://lazarus-lightning-stream_gateway_1:8402/x402/ticket/health
      # offered on Sellers and on an empty Browse, added only when the owner clicks
      XBT_UI_SUGGESTED_SELLERS: npub1kqdrfmfg6mg52sy3ehu4vv7m3fjpa0830rhjdmvqrf09u3t3724q8cwr6a
      # the built-in Stream relay needs this box's public port 443, which an Umbrel app can't take
      XBT_UI_RELAY_UNAVAILABLE: "an Umbrel app can't take this box's port 443, which a relay needs. Run one with the Linux package on a server with a public address (see the setup guide)."
      XBT_UI_RESTART_HINT: restart Lightning Stream from your Umbrel (right-click its icon, then Restart)
      # Nostr relays the Services page reads sellers' signed listings from (opt-in Nostr page)
      XBT_UI_NOSTR_RELAYS: wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol
      # Hashrate: renting this box's miners out (Sell) and other people's in (Services)
      XBT_UI_HASHER: http://lazarus-lightning-stream_hasher_1:23342
      XBT_UI_HASHER_SETTINGS: /data/run/hashrate/settings.json
      XBT_UI_HASHER_SLICES: http://lazarus-lightning-stream_hasher_1:23344
      XBT_UI_HASHER_TOKEN_FILE: /data/run/hashrate/control-token
      XBT_UI_HASHRENT: http://lazarus-lightning-stream_renter_1:23343
      XBT_UI_HASHRENT_TOKEN_FILE: /data/run/hashrate/control-token
      # Hashrate → Your gateway: the node the Stream Gateway reaches, written into run/datum/config.json
      # (the same node the signer uses; its RPC cookie is init's, never in the config)
      XBT_UI_DATUM_RPCURL: http://${APP_BITCOIN_NODE_IP:-${APP_XBT_KNOTS_NODE_HOST}}:${APP_BITCOIN_RPC_PORT:-${APP_XBT_KNOTS_RPC_PORT}}
      # no XBT_UI_PLATFORM_LOGIN: umbrelOS 2.0 runs no app-proxy container (umbreld proxies the port
      # itself, after its own login), so that name is free for any other app to take on this network.
      # The app password is Umbrel's deterministic one, shown on the app's page in the dashboard
      # the signer's one-time enrolment code: the setup page fills it in, so no log has to be read
      XBT_UI_ENROLL_CODE_FILE: /data/run/enroll/enroll-code
      # the shops without a web address the owner adds; the connector and the MCP read it
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      # AI: the address programs on the LAN use (the connector serves it, in this container's network),
      # and the files the AI page shares with it in run/ai
      XBT_UI_AI_ENDPOINT: http://${DEVICE_DOMAIN_NAME}:33540/v1
      XBT_UI_AI_SELLERS: /data/run/ai/sellers.json
      XBT_UI_CREDENTIALS: /data/run/ai/credentials.json
      XBT_UI_AI_STATE: /data/run/ai/state.json
      # Files (Sell): the shared folder, served by the UI to the gateway only, on the app's private
      # network (not published), with the files key the gateway's route adds (docs/FILES.md)
      XBT_UI_FILES_DIR: /data/ui/files
      # the owner picks the shared folder under Umbrel's Downloads (what the Files app shows),
      # which the app only reads (mounted read-only below)
      XBT_UI_FILES_ROOT: /downloads
      XBT_UI_FILES_ROOT_WORDS: the Downloads folder in Umbrel's Files app
      XBT_UI_FILES_BIND: 0.0.0.0:8486
      XBT_UI_FILES_UPSTREAM: http://lazarus-lightning-stream_ui_1:8486
      # the VPN pages: the devices and exit they write for the vpn service, its status they read, and
      # where devices reach its WireGuard endpoint on the LAN
      XBT_UI_VPN_DIR: /data/run/vpn
      XBT_UI_VPN_STATUS_DIR: /data/run/vpn-status
      XBT_UI_VPN_ENDPOINT: ${DEVICE_DOMAIN_NAME}:51830
      # where the shop's gateway reaches the VPN service's tunnel endpoint, to sell this box's exit
      XBT_UI_VPN_TUNNEL_UPSTREAM: http://lazarus-lightning-stream_vpn_1:51880
    volumes:
      - ${APP_DATA_DIR}/data/ui:/data/ui
      # Umbrel's shared Downloads, read-only, for Files (umbrelOS 1.x rewrites this path to
      # ${UMBREL_ROOT}/home/Downloads; the STORAGE_DOWNLOADS permission covers it)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
      # the AI page's files, shared by group with the connector (the credential store both write)
      - ${APP_DATA_DIR}/data/run/ai:/data/run/ai
      - ${APP_DATA_DIR}/data/run/vpn:/data/run/vpn
      - ${APP_DATA_DIR}/data/run/vpn-status:/data/run/vpn-status:ro
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the UI owns the MCP token (run/ui/mcp-http-token) and rotates it on its Agents page
      - ${APP_DATA_DIR}/data/run/ui:/data/run/ui
      # the Lightning page writes the rail macaroon here
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln
      # the Sell page writes the gateway's config and macaroons here
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway
      # the Hashrate page writes the hasher's settings here; the control token is here too
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate
      # the Hashrate page writes the Stream Gateway's config here
      - ${APP_DATA_DIR}/data/run/datum:/data/run/datum
      - ${APP_DATA_DIR}/data/run/shops:/data/run/shops
      - ${APP_DATA_DIR}/data/run/enroll:/data/run/enroll:ro
      - *lightning-cert

  # Connects the app to the box's Lightning node with no step by the owner, in two one-shots, either of
  # which may start first: the owner can install Lightning Stream before making the wallet in Lightning
  # Fork, and the keys arrive when it is made, with no restart.
  # node-keys-bake runs as the Lightning app's user (1000), the only user that can enter its data
  # (read-only, here and in no other service). It waits for the admin macaroon (the owner making the
  # wallet), and asks the node to bake the app's narrow macaroons, each under a root key of its own: the
  # wallet's (info:read offchain:read offchain:write onchain:read) and the gateway's three (invoices;
  # info:read; SignMessage alone, which vouches for the shop's direct link). It writes them only to
  # run/node-keys, the hand-over it shares with the UI, and exits. It reads run/ln and run/gateway (by
  # their groups) only to see what is there already and what the owner turned off: a key already there
  # is kept, and a key the owner disconnected is not made again. Once its keys are made it exits, and
  # nothing restarts it (restart: "no"). It needs the node's REST, so it is on the app's network:
  # umbrelOS joins an app's containers to its one shared network, where Lightning Fork's node is, and a
  # network of this app's own could not hold another app's container (no narrower network to give it).
  node-keys-bake:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-d43386c2da47@sha256:6231aef23717b7c8051e706c52fddf598061e2d94a56aab9e29a2af19713009d
    command: ["node-keys"]
    user: "1000:1000"
    restart: "no"
    group_add:
      # the hand-over's group (the UI's), run/gateway's (the gateway's) and run/ln's (the rail's)
      - "10005"
      - "10007"
      - "10008"
    healthcheck:
      disable: true
    environment:
      XBT_KEYS_NODE_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_KEYS_TLS_CERT: /node/tls.cert
      XBT_KEYS_ADMIN: /node/data/chain
      XBT_KEYS_RAIL_DIR: /data/run/ln
      XBT_KEYS_GW_DIR: /data/run/gateway
      XBT_KEYS_BAKE_TO: /data/run/node-keys
      # a wallet the owner is making is noticed within half a minute
      XBT_KEYS_RETRY_MAX_S: "30"
    volumes:
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln:ro
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway:ro
      - ${APP_DATA_DIR}/data/run/node-keys:/data/run/node-keys
      - *lightning-data

  # node-keys runs as the UI and reads nothing of the Lightning app: it moves each key node-keys-bake
  # leaves in run/node-keys to where the setup pages would write it (run/ln, run/gateway), with its root
  # key id, removes it from the hand-over, and exits once every key is in place.
  node-keys:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-d43386c2da47@sha256:6231aef23717b7c8051e706c52fddf598061e2d94a56aab9e29a2af19713009d
    command: ["node-keys"]
    restart: "no"
    # it only moves files: no network at all (the node's address below is only what the tool asks for)
    network_mode: none
    healthcheck:
      disable: true
    environment:
      XBT_KEYS_NODE_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_KEYS_TAKE_FROM: /data/run/node-keys
      XBT_KEYS_WATCH_S: "5"
      XBT_KEYS_RAIL_DIR: /data/run/ln
      XBT_KEYS_GW_DIR: /data/run/gateway
    volumes:
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway
      - ${APP_DATA_DIR}/data/run/node-keys:/data/run/node-keys

  connector:
    <<: *service
    image: ghcr.io/awokenlazarus/lightning-stream:0.1.0-d43386c2da47@sha256:a9a80455ca8da7c8fe1eaa7beae93351dd2428a4ad32fc2cf97faa8def2fac9b
    network_mode: "service:ui"
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      ui:
        condition: service_started
      signer:
        condition: service_started
    environment:
      B2_SIGNER_SOCK: /data/run/signer/signer.sock
      B2_STREAM_DIR: /data/run/signer/streams
      # the starter policy's task; the signed policy can only be tighter than LS_MAX_SATS
      LS_TASK: default
      LS_MAX_SATS: "20000"
      LS_LISTEN: 127.0.0.1:8484
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      # the AI endpoint: every program on the LAN needs a key from the AI page (run/ai/credentials.json)
      LS_AI_LISTEN: 0.0.0.0:33540
      LS_CREDENTIALS: /data/run/ai/credentials.json
      LS_AI_SELLERS: /data/run/ai/sellers.json
      LS_AI_STATE: /data/run/ai/state.json
    volumes:
      # the AI endpoint's files: keys and their spend (read and booked), the sellers (read), their health (written)
      - ${APP_DATA_DIR}/data/run/ai:/data/run/ai
      # the control socket, read-only: this service cannot replace it, and it holds no keys
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the stream sockets, read-write. The same host directory the signer sees under run/signer.
      - ${APP_DATA_DIR}/data/run/signer/streams:/data/run/signer/streams
      # the shops without a web address, read-only: their transport documents go in each call to the signer
      - ${APP_DATA_DIR}/data/run/shops:/data/run/shops:ro

  gateway:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-gateway:0.1.0-b8a60adfece2@sha256:c1969c9e93fb8bda6e481f11c71a4b099cbbe76faaea4ad0d458090068d31022
    # each held ticket is followed on its own connection to the node; a stop cancels nothing.
    # the image starts the gateway only once run/gateway/config.json exists, and publishes no host port
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/gateway:/data/gateway
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway:ro
      - *lightning-cert

  hasher:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-b8a60adfece2@sha256:5bc4b1fb7d5e666e70e66928d1e9994d06cd4db03079ebc0b8dba49d4a245c87
    stop_grace_period: 15s
    command: ["hasher", "--key", "/data/hashrate/link.key", "--nostr-key", "/data/hashrate/nostr.key",
              "--miners", "0.0.0.0:23340", "--link", "0.0.0.0:23341", "--slices", "0.0.0.0:23344",
              "--control", "0.0.0.0:23342", "--control-token-file", "/data/run/hashrate/control-token",
              "--config", "/data/run/hashrate/settings.json", "--relays", "wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol",
              "--gateway", "http://lazarus-lightning-stream_gateway_1:8402",
              "--miners-public", "${DEVICE_DOMAIN_NAME}:23340", "--link-lan", "${DEVICE_DOMAIN_NAME}:23341",
              "--report", "/data/hashrate/hasher.json"]
    ports:
      # this box's miners, on the LAN
      - "23340:23340"
      # renters' apps: reached from outside only with a port forward or a tunnel
      - "23341:23341"
    volumes:
      - ${APP_DATA_DIR}/data/hashrate:/data/hashrate
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate:ro

  renter:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-b8a60adfece2@sha256:5bc4b1fb7d5e666e70e66928d1e9994d06cd4db03079ebc0b8dba49d4a245c87
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      signer:
        condition: service_started
    command: ["renter", "--key", "/data/hashrate/renter.key", "--control", "0.0.0.0:23343",
              "--control-token-file", "/data/run/hashrate/control-token", "--state", "/data/hashrate",
              "--upstream", "auto", "--datum-candidates", "127.0.0.1:23339,datum_web_1:23334,datum-gateway_web_1:23334",
              "--user", "rented", "--relays", "wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol",
              "--signer", "/data/run/rental/signer.sock", "--task", "hashrate"]
    volumes:
      - ${APP_DATA_DIR}/data/hashrate:/data/hashrate
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate:ro
      # the signer's socket for the renter alone, read-only: the renter pays each piece of work through it,
      # and no other service reaches it (the "hashrate" task's rental terms are paid on it only)
      - ${APP_DATA_DIR}/data/run/rental:/data/run/rental:ro

  # The Stream Gateway (DATUM-compatible), first of the renter's candidates. It shares the renter's network
  # namespace, so its stratum (127.0.0.1:23339) and its API (127.0.0.1:7152: /xbt/job opens each job for
  # the renter's check) are the renter's loopback. Never --allow-unblinded: a job it can't show masked is
  # refused. It starts once the Hashrate page writes run/datum/config.json, and again when that or the
  # cookie changes; until then it waits, and that is healthy. --peer: a restarted renter gets a new
  # namespace and would leave this one in the old one, so xbt-supervise looks at the renter's control port
  # on loopback and exits when it stops answering; restart: on-failure then starts it in the renter's new one.
  datum:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-datum-gateway:0.1.0-b8a60adfece2@sha256:05aa9519c24e6b915ecbfdd45946367c6eda597af5474968a9814b7709b7585a
    network_mode: "service:renter"
    stop_grace_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
      renter:
        condition: service_started
    entrypoint: ["/usr/bin/xbt-supervise", "--wait", "/data/run/datum/config.json", "--watch", "/data/run/datum/rpc.cookie",
                 "--peer", "127.0.0.1:23343", "--", "/usr/bin/xbt-datum-gateway", "-c", "/data/run/datum/config.json"]
    healthcheck:
      test: ["CMD", "/usr/bin/xbt-supervise", "probe", "http://127.0.0.1:7152/", "--waiting-for", "/data/run/datum/config.json"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      # its found blocks (submitblocks) and anything else it keeps
      - ${APP_DATA_DIR}/data/datum:/data/datum
      # its config (the UI's) and the node's RPC cookie (init's), read-only
      - ${APP_DATA_DIR}/data/run/datum:/data/run/datum:ro

  # The VPN service: the WireGuard endpoint the owner's devices pair with on the LAN (UDP 51830; 51820
  # is left to WireGuard apps), and this box's exit if the owner offers one on the VPN page. Userspace
  # WireGuard and TCP/IP: no TUN device and no capabilities. Idle until a device is added or an exit
  # offered; it restarts itself when they change.
  vpn:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-vpn:0.1.0-c8ba24a813dc@sha256:21a886fc41d25146afd8a9cfc2b8136c386375d6ce251cb9b0ff3b8ecdda732c
    stop_grace_period: 10s
    environment:
      XBT_VPN_NOSTR_RELAYS: wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol
      # priced exits are paid through the owner's wallet: its socket, and the dir paid tunnels are streamed through
      B2_SIGNER_SOCK: /data/run/signer/signer.sock
      B2_STREAM_DIR: /data/run/signer/streams
      XBT_SHOPS_FILE: /data/run/shops/shops.json
      # this box's exit's tunnel endpoint, which the shop's gateway joins buyers' paid tunnels to (not published)
      XBT_VPN_TUNNEL_LISTEN: 0.0.0.0:51880
    ports:
      - "51830:51820/udp"
    volumes:
      - ${APP_DATA_DIR}/data/vpn:/data/vpn
      - ${APP_DATA_DIR}/data/run/vpn:/data/run/vpn:ro
      - ${APP_DATA_DIR}/data/run/vpn-status:/data/run/vpn-status
      # the signer's socket, read-only, and the stream sockets (the same host dir the signer sees), read-write
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      - ${APP_DATA_DIR}/data/run/signer/streams:/data/run/signer/streams
      - ${APP_DATA_DIR}/data/run/shops:/data/run/shops:ro
