# Lightning Stream. Unpublished: side-load only. The wallet's services, the connector and the gateway.
# Buy: the signer, the anchor witness, the MCP server and the web UI, as in the wallet app. The main
# page is this app's own page (port 8482). Agents on the LAN use host port 33511.
# AI: the connector also serves an OpenAI-compatible endpoint on host port 33540 for programs on the
# LAN; each needs a key the owner makes on the AI page, with its own limit (run/ai, shared by group).
# Play: the connector pays through the signer and streams the body. It is not published on the LAN.
# It shares the UI's network namespace and listens on 127.0.0.1:8484, which is what XBT_UI_CONNECTOR
# names. A browser on another machine cannot open that address. The UI process, in that namespace, can.
# Sell: the gateway, the same image as the gateway app, so it stays idle until its config exists
# (xbt-supervise --wait). The owner turns it on from the Sell page of the app's own page
# (XBT_UI_SELL=1), which writes the gateway's config and its two narrow macaroons. The gateway mounts
# only those. The signer is the only service that can spend. Of the Lightning node's data the
# services mount only tls.cert; the one-shot node-keys alone reads its admin macaroon, once, to have
# the node bake the narrow macaroons (below), and keeps nothing of it.
#
# Hashrate: two services of the xbt-hashlink image, as xbt-hashrate. The hasher takes this box's
# miners on host port 23340 (LAN) and renters' apps on 23341, which needs a port forward or a tunnel
# (the owner writes that public address on Sell → Hashrate; without it no listing goes to public relays)
# to be reached from outside. Until the owner turns renting on (Sell → Hashrate, which writes
# run/hashrate/settings.json), it publishes nothing and lets miners that connect go. A miner nobody
# rents hashes for the owner's own pool. Renters pay each piece of work through this app's gateway,
# under /hashrate/; the gateway passes it to the hasher on 23344, which is not published. The renter
# rents other people's miners into the owner's own DATUM Gateway and pays through the signer, as the
# "hashrate" task of the spending rules. It is in the signer's group for the socket. Both control
# pages (23342, 23343) are reached by the UI only, with the token init makes in run/hashrate/. The
# image has no published digest yet: it is the local tag scripts/oci_build.sh --load gives.
#
# Stream sockets live in run/signer/streams (B2_STREAM_DIR for the signer and the connector). The
# connector runs as the signer's user, because the published signer image cannot gain a group until
# it is rebuilt. It mounts that directory read-write and the rest of run/signer read-only, and it
# does not mount the signer's state. A fresh data dir arrives owned by the box user, so init's chown
# of run/signer covers the subdirectory. The connector image has no published digest yet: it is the
# local tag scripts/oci_build.sh --load gives (lightning-stream:0.1.0). The other images are pinned.
version: "3.7"

x-service: &service
  restart: on-failure
  # a static binary as PID 1 gets no default action for SIGTERM: without an init, a stop waits out the
  # grace period and kills the service (umbrelOS stops and restarts apps with SIGTERM)
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    init:
      condition: service_completed_successfully

x-lightning-data: &lightning-data
  # the Lightning node's mainnet admin macaroon, the file alone: mounted into node-keys only. The
  # directories above it are its owner's alone (0700), so a mount of the directory could not be read
  # by node-keys' group; the file itself is readable by the group (0640)
  type: bind
  source: ${APP_LIGHTNING_FORK_NODE_DATA_DIR}/data/chain/bitcoin/mainnet/admin.macaroon
  target: /node/admin.macaroon
  read_only: true
  bind:
    create_host_path: false

x-lightning-cert: &lightning-cert
  type: bind
  source: ${APP_LIGHTNING_FORK_NODE_DATA_DIR}/tls.cert
  target: /data/lightning/tls.cert
  read_only: true
  bind:
    # a missing certificate stops the start: Docker would otherwise make a directory in its place
    create_host_path: false

services:
  app_proxy:
    environment:
      APP_HOST: lazarus-lightning-stream_ui_1
      APP_PORT: 8482

  init:
    image: ghcr.io/awokenlazarus/xbt-init:0.1.0-8f4a334734d8@sha256:a86d77496c2c0de78bbc14da60d557f9e334c21e531dcc9e2e9c18b65f612a37
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      XBT_INIT_COMPONENTS: signer,witness,mcp,ui,gateway,hashrate
      XBT_INIT_NODE_RPC_USER: ${APP_BITCOIN_RPC_USER:-${APP_XBT_KNOTS_RPC_USER}}
      XBT_INIT_NODE_RPC_PASS: ${APP_BITCOIN_RPC_PASS:-${APP_XBT_KNOTS_RPC_PASS}}
      XBT_INIT_UI_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data

  witness:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-anchor-witness:0.1.0-8f4a334734d8@sha256:50394a52e5545c393821b16fabdc86d36c34f15905198608b53d6889677cb143
    network_mode: none
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/witness:/data/witness
      - ${APP_DATA_DIR}/data/run/anchor:/data/run/anchor

  signer:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-signer:0.1.0-8f4a334734d8@sha256:297982579e05664af06cd0e44d07c519878826d006007009f808430da2c862fb
    entrypoint: ["/usr/bin/xbt-supervise", "--watch", "/data/run/ln/rail.macaroon", "--watch", "/data/lightning/tls.cert", "--", "/usr/bin/xbt-signer"]
    stop_grace_period: 1m
    environment:
      XBT_NODE_RPC_HOST: ${APP_BITCOIN_NODE_IP:-${APP_XBT_KNOTS_NODE_HOST}}
      XBT_NODE_RPC_PORT: ${APP_BITCOIN_RPC_PORT:-${APP_XBT_KNOTS_RPC_PORT}}
      # the stand-in names its chain; with the slot's node the signer reads it from the node
      XBT_CHAIN: ${APP_XBT_KNOTS_CHAIN:-}
      B2_LN_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      B2_LN_MACAROON: /data/run/ln/rail.macaroon
      B2_MAINNET_ACK_FILE: /data/run/ln/mainnet-ack
      B2_LN_TLS_CERT: /data/lightning/tls.cert
      # the same directory the connector binds stream sockets in
      B2_STREAM_DIR: /data/run/signer/streams
      # a copy of the one-time enrolment code for the setup page (run/enroll: the signer and the UI only)
      B2_ENROLL_CODE_COPY: /data/run/enroll/enroll-code
    volumes:
      - ${APP_DATA_DIR}/data/signer:/data/signer
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer
      - ${APP_DATA_DIR}/data/run/anchor:/data/run/anchor:ro
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln:ro
      - ${APP_DATA_DIR}/data/run/enroll:/data/run/enroll
      - *lightning-cert

  mcp:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-mcp:0.1.0-8f4a334734d8@sha256:8313b9ec5807be14d74b1b6cb076baea176539250aa796ce351c751c78027df9
    stop_grace_period: 30s
    environment:
      # an over-threshold payment waits this long for the owner's approval in the UI
      XBT_MCP_APPROVAL_WAIT_S: "300"
      # the Lightning rail's and the tickets' own tools (status, stop) beside xbt402_pay
      XBT_MCP_LN: "1"
      XBT_MCP_TICKETS: "1"
    ports:
      # agents on the LAN. 33510 is the wallet app's host port, so this app uses 33511.
      # other apps on this box use lazarus-lightning-stream_mcp_1:33510, behind the bearer token
      - "33511:33510"
    volumes:
      - ${APP_DATA_DIR}/data/mcp:/data/mcp
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the bearer token is the UI's file (0640, group xbt-wallet-ui): read on every request, never written here
      - ${APP_DATA_DIR}/data/run/ui:/data/run/ui:ro

  ui:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-8f4a334734d8@sha256:85a51ac5794a5689d279391e8ed8f1bd8131b120170e15629b06eb2f3082c085
    stop_grace_period: 15s
    environment:
      XBT_UI_BIND: 0.0.0.0:8482
      XBT_UI_PASSWORD_FILE: /data/ui/secrets/xbt-ui-password
      XBT_UI_SIGNER_SOCK: /data/run/signer/signer.sock
      XBT_UI_MCP_URL: http://${DEVICE_DOMAIN_NAME}:33511/mcp
      XBT_UI_LN_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_UI_LN_TLS_CERT: /data/lightning/tls.cert
      # the connector shares this container's network namespace and listens on loopback only
      XBT_UI_CONNECTOR: http://127.0.0.1:8484
      # Sell: the gateway's setup on this page, as the gateway's container sees the node and the paths
      XBT_UI_SELL: "1"
      XBT_UI_GW_NODE_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_UI_GW_NODE_TLS_CERT: /data/lightning/tls.cert
      XBT_UI_GW_HEALTH_URL: http://lazarus-lightning-stream_gateway_1:8402/x402/ticket/health
      # offered on Sellers and on an empty Browse, added only when the owner clicks
      XBT_UI_SUGGESTED_SELLERS: https://stream.lazarus-xbt.xyz
      XBT_UI_RESTART_HINT: restart Lightning Stream from your Umbrel (right-click its icon, then Restart)
      # Nostr relays the Services page reads sellers' signed listings from (opt-in Nostr page)
      XBT_UI_NOSTR_RELAYS: wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol
      # Hashrate: renting this box's miners out (Sell) and other people's in (Services)
      XBT_UI_HASHER: http://lazarus-lightning-stream_hasher_1:23342
      XBT_UI_HASHER_SETTINGS: /data/run/hashrate/settings.json
      XBT_UI_HASHER_SLICES: http://lazarus-lightning-stream_hasher_1:23344
      XBT_UI_HASHER_TOKEN_FILE: /data/run/hashrate/control-token
      XBT_UI_HASHRENT: http://lazarus-lightning-stream_renter_1:23343
      XBT_UI_HASHRENT_TOKEN_FILE: /data/run/hashrate/control-token
      # no XBT_UI_PLATFORM_LOGIN: umbrelOS 2.0 runs no app-proxy container (umbreld proxies the port
      # itself, after its own login), so that name is free for any other app to take on this network.
      # The app password is Umbrel's deterministic one, shown on the app's page in the dashboard
      # the signer's one-time enrolment code: the setup page fills it in, so no log has to be read
      XBT_UI_ENROLL_CODE_FILE: /data/run/enroll/enroll-code
      # AI: the address programs on the LAN use (the connector serves it, in this container's network),
      # and the files the AI page shares with it in run/ai
      XBT_UI_AI_ENDPOINT: http://${DEVICE_DOMAIN_NAME}:33540/v1
      XBT_UI_AI_SELLERS: /data/run/ai/sellers.json
      XBT_UI_CREDENTIALS: /data/run/ai/credentials.json
      XBT_UI_AI_STATE: /data/run/ai/state.json
    ports:
      # the AI endpoint for programs on the LAN (served by the connector, which shares this container's
      # network): every request needs a key the owner made on the AI page
      - "33540:33540"
    volumes:
      - ${APP_DATA_DIR}/data/ui:/data/ui
      # the AI page's files, shared by group with the connector (the credential store both write)
      - ${APP_DATA_DIR}/data/run/ai:/data/run/ai
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the UI owns the MCP token (run/ui/mcp-http-token) and rotates it on its Agents page
      - ${APP_DATA_DIR}/data/run/ui:/data/run/ui
      # the Lightning page writes the rail macaroon here
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln
      # the Sell page writes the gateway's config and macaroons here
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway
      # the Hashrate page writes the hasher's settings here; the control token is here too
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate
      - ${APP_DATA_DIR}/data/run/enroll:/data/run/enroll:ro
      - *lightning-cert

  # One-shot: connects the app to the box's Lightning node with no step by the owner. It reads the
  # node's admin macaroon (the Lightning app's data, read-only, here and in no other service) and asks
  # the node to bake the app's narrow macaroons, each under a root key of its own: the wallet's
  # (info:read offchain:read offchain:write onchain:read) and the gateway's two (invoices; info:read).
  # It writes only those, where the setup pages would, and exits. A key already there is kept; a key
  # the owner disconnected is not made again. The Lightning app's files are its user's (1000), hence
  # the group. It waits for the node (starting, or its wallet still locked) and asks again.
  node-keys:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-wallet-ui:0.1.0-8f4a334734d8@sha256:85a51ac5794a5689d279391e8ed8f1bd8131b120170e15629b06eb2f3082c085
    command: ["node-keys"]
    restart: "no"
    group_add:
      - "1000"
    healthcheck:
      disable: true
    environment:
      XBT_KEYS_NODE_REST: https://${APP_LIGHTNING_FORK_NODE_IP}:${APP_LIGHTNING_FORK_NODE_REST_PORT}
      XBT_KEYS_TLS_CERT: /data/lightning/tls.cert
      XBT_KEYS_ADMIN: /node/admin.macaroon
      XBT_KEYS_RAIL_DIR: /data/run/ln
      XBT_KEYS_GW_DIR: /data/run/gateway
    volumes:
      - ${APP_DATA_DIR}/data/run/ln:/data/run/ln
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway
      - *lightning-data
      - *lightning-cert

  connector:
    <<: *service
    image: ghcr.io/awokenlazarus/lightning-stream:0.1.0-8f4a334734d8@sha256:71748a25baa2aa3ec76d8327c8c6d2269ff956aea44016f8d2c5c168de878773
    network_mode: "service:ui"
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      ui:
        condition: service_started
      signer:
        condition: service_started
    environment:
      B2_SIGNER_SOCK: /data/run/signer/signer.sock
      B2_STREAM_DIR: /data/run/signer/streams
      # the starter policy's task; the signed policy can only be tighter than LS_MAX_SATS
      LS_TASK: default
      LS_MAX_SATS: "20000"
      LS_LISTEN: 127.0.0.1:8484
      # the AI endpoint: every program on the LAN needs a key from the AI page (run/ai/credentials.json)
      LS_AI_LISTEN: 0.0.0.0:33540
      LS_CREDENTIALS: /data/run/ai/credentials.json
      LS_AI_SELLERS: /data/run/ai/sellers.json
      LS_AI_STATE: /data/run/ai/state.json
    volumes:
      # the AI endpoint's files: keys and their spend (read and booked), the sellers (read), their health (written)
      - ${APP_DATA_DIR}/data/run/ai:/data/run/ai
      # the control socket, read-only: this service cannot replace it, and it holds no keys
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
      # the stream sockets, read-write. The same host directory the signer sees under run/signer.
      - ${APP_DATA_DIR}/data/run/signer/streams:/data/run/signer/streams

  gateway:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-gateway:0.1.0-8f4a334734d8@sha256:87a1467be3beb60e204629533237fb7c0b4d552f959d601b09f9d54dbac8cbc3
    # each held ticket is followed on its own connection to the node; a stop cancels nothing.
    # the image starts the gateway only once run/gateway/config.json exists, and publishes no host port
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/gateway:/data/gateway
      - ${APP_DATA_DIR}/data/run/gateway:/data/run/gateway:ro
      - *lightning-cert

  hasher:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-8f4a334734d8@sha256:921be6f0886d4cb28cae6a1a7b634f9dfa14b6f38b9a7058174493a81088a3f2
    stop_grace_period: 15s
    command: ["hasher", "--key", "/data/hashrate/link.key", "--nostr-key", "/data/hashrate/nostr.key",
              "--miners", "0.0.0.0:23340", "--link", "0.0.0.0:23341", "--slices", "0.0.0.0:23344",
              "--control", "0.0.0.0:23342", "--control-token-file", "/data/run/hashrate/control-token",
              "--config", "/data/run/hashrate/settings.json", "--relays", "wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol",
              "--gateway", "http://lazarus-lightning-stream_gateway_1:8402",
              "--miners-public", "${DEVICE_DOMAIN_NAME}:23340", "--link-lan", "${DEVICE_DOMAIN_NAME}:23341",
              "--report", "/data/hashrate/hasher.json"]
    ports:
      # this box's miners, on the LAN
      - "23340:23340"
      # renters' apps: reached from outside only with a port forward or a tunnel
      - "23341:23341"
    volumes:
      - ${APP_DATA_DIR}/data/hashrate:/data/hashrate
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate:ro

  renter:
    <<: *service
    image: ghcr.io/awokenlazarus/xbt-hashlink:0.1.0-8f4a334734d8@sha256:921be6f0886d4cb28cae6a1a7b634f9dfa14b6f38b9a7058174493a81088a3f2
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
      signer:
        condition: service_started
    command: ["renter", "--key", "/data/hashrate/renter.key", "--control", "0.0.0.0:23343",
              "--control-token-file", "/data/run/hashrate/control-token", "--state", "/data/hashrate",
              "--upstream", "auto", "--datum-candidates", "datum_web_1:23334,datum-gateway_web_1:23334",
              "--user", "rented", "--relays", "wss://relay.lazarus-xbt.xyz,wss://relay.kilombino.com,wss://relay.damus.io,wss://nos.lol",
              "--signer", "/data/run/signer/signer.sock", "--task", "hashrate"]
    volumes:
      - ${APP_DATA_DIR}/data/hashrate:/data/hashrate
      - ${APP_DATA_DIR}/data/run/hashrate:/data/run/hashrate:ro
      # the signer's socket, read-only: the renter pays each piece of work through it
      - ${APP_DATA_DIR}/data/run/signer:/data/run/signer:ro
