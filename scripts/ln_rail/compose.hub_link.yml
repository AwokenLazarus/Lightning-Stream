# The hub's Lightning link (AGP-109) on lightning-fork-lab (a5cadc5): one chain node and one
# Lightning Fork node, each published on loopback, with a CPU cap. Its own ports and its own compose
# project, so it runs beside scripts/ln_rail_regtest.sh. Ports are below the kernel's ephemeral range.
#   knots-b2b RPC   127.0.0.1:${HUB_LINK_NODE_PORT:-17581}  (the hub's, sellers' and buyers' node)
#   lf1 REST        127.0.0.1:${HUB_LINK_LN_PORT:-17591}    (the operator's Lightning Fork node)
services:
  knots-b2b:
    cpus: 2
    ports: ["127.0.0.1:${HUB_LINK_NODE_PORT:-17581}:18443"]
  lf1:
    cpus: 2
    ports: ["127.0.0.1:${HUB_LINK_LN_PORT:-17591}:8080"]
