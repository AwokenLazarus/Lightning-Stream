[workspace]
resolver = "2"
members = ["crates/xbt-primitives", "crates/xbt402", "crates/xbt402-interop", "crates/xbt-signer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
secp256k1 = { version = "0.29.1", features = ["global-context", "std"] }
sha2 = "0.10.9"
ripemd = "0.1.3"
blake2 = "0.10.6"
hmac = "0.12.1"
hex = "0.4.3"
thiserror = "2.0"
ruint = { version = "1.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"
ureq = "2.12"
tiny_http = "0.12"
xbt-primitives = { path = "crates/xbt-primitives" }
xbt402 = { path = "crates/xbt402" }
xbt-signer = { path = "crates/xbt-signer" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Size-optimised release: fat LTO, opt-level z. scripts/build_matrix.sh reports both.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
