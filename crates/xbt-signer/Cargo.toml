[package]
name = "xbt-signer"
description = "B2 agent-wallet signer in Rust: keys never in the client, policy engine, sealed keys, signature log, refund custody (AGP-027)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xbt-primitives.workspace = true
xbt402 = { workspace = true, features = ["http-client"] }
# a seller reached by its key (a shop without a web address): crates/xbt-iroh-link
xbt-iroh-link = { path = "../xbt-iroh-link" }
sha2.workspace = true
# stream tickets: a ticket's secret and tag are HMAC-SHA256 of the sealed seed (already in the tree through xbt402)
hmac.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ureq.workspace = true
getrandom = "0.2"
aes-gcm = "0.10.3"
scrypt = { version = "0.11", default-features = false }
ed25519-dalek = "2.1"
zeroize = "1"
indexmap = "2"
xbt-svc.workspace = true
# AGP-048: invoice signatures (recovery) and the LND REST client's pinned TLS certificate
secp256k1 = { workspace = true, features = ["recovery"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# AGP-066: the LN REST URL's host, parsed as ureq parses it (already in the tree through ureq)
url = "2.5"
# the public certificate authorities for a WebSocket to an https seller, as ureq trusts them (already in the tree through ureq)
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
# the ticket payer is tested against the real seller gateway, in process (tests/ticket_pay.rs)
xbt-gateway = { path = "../xbt-gateway" }
xbt402 = { workspace = true, features = ["http-client", "http-server"] }
# a stand-in web app that serves its page only compressed, as llama.cpp's server does (already in the tree through ureq)
flate2 = "1"
