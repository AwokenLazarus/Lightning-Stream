[package]
name = "xbt402"
description = "xbt402: HTTP 402 payments over XBT Spillman channels (x402 v2 batch-settlement XBT binding; xbt-channel alias), v1.1 + v1.2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# blocking HTTP client transport (ureq) for the payer
http-client = ["dep:ureq"]
# std::net server around Provider::serve (header cap, read deadlines, connection limit)
http-server = ["dep:xbt-svc"]
# bitcoind JSON-RPC ChainBackend and Wallet (ureq)
rpc = ["dep:ureq"]

[dependencies]
xbt-primitives.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
getrandom = "0.2"
indexmap = "2"
ureq = { workspace = true, optional = true }
xbt-svc = { workspace = true, optional = true }

[dev-dependencies]
# AGP-105: the parser ureq hands a URL to, to test `wire::sendable_url` against (already in the tree)
url = "2.5"

[[test]]
name = "http_limits"
required-features = ["http-client", "http-server"]
