[package]
name = "xbt402"
description = "xbt402: HTTP 402 payments over XBT Spillman channels (x402 v2 batch-settlement XBT binding; xbt-channel alias), v1.1 + v1.2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# blocking HTTP client transport (ureq) for the payer
http-client = ["dep:ureq"]
# std::net server around Provider::serve (header cap, read deadlines, connection limit)
http-server = ["dep:xbt-svc"]
# bitcoind JSON-RPC ChainBackend and Wallet (ureq)
rpc = ["dep:ureq"]
# the hub's link to a Lightning node (AGP-109): REST with the node's certificate pinned
ln-wallet = ["dep:ureq", "dep:rustls", "dep:url"]
# fixed-nonce adaptor pre-sign, for the vector emitter only (nonce reuse leaks the key)
vector-emitter = []

[dependencies]
xbt-primitives.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
getrandom = "0.2"
indexmap = "2"
# AGP-073 K1: the hub's ch2 keys sealed at rest (the versions xbt-signer's keystore already uses)
aes-gcm = "0.10.3"
zeroize = "1"
ureq = { workspace = true, optional = true }
# AGP-109: a Lightning node's signed message is checked by recovering its key (in the tree already:
# xbt-primitives' secp256k1, and the recovery feature xbt-signer turns on for invoices)
secp256k1 = { workspace = true, features = ["recovery"] }
# AGP-109: the pinned certificate of the Lightning node's REST listener, and its URL as ureq parses
# it (the versions xbt-signer's Lightning client already uses)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
url = { version = "2.5", optional = true }
# container plumbing for the xbt402-hub binary (AGP-038): data dir, secrets, health, proxy URLs
xbt-svc = { workspace = true, optional = true }

# the hub service (B1 `python -m xbt402.hub --config hub.json`); the library needs none of these
[dev-dependencies]
# AGP-105: the parser ureq hands a URL to, to test `wire::sendable_url` against (already in the tree)
url = "2.5"

[[bin]]
name = "xbt402-hub"
required-features = ["rpc", "http-client", "http-server", "ln-wallet"]

[[test]]
name = "http_limits"
required-features = ["http-client", "http-server"]
