[package]
name = "xbt402"
description = "xbt402: HTTP 402 payments over XBT Spillman channels (x402 v2 scheme xbt-channel), v1.1 + v1.2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# blocking HTTP client transport (ureq) for the payer
http-client = ["dep:ureq"]
# tiny_http server around Provider::serve
http-server = ["dep:tiny_http"]
# bitcoind JSON-RPC ChainBackend and Wallet (ureq)
rpc = ["dep:ureq"]

[dependencies]
xbt-primitives.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
serde.workspace = true
# arbitrary_precision: routed prices and meters are amsat (1e-21 sat) integers far above u64, and signed
# quotes must round-trip them exactly (B1 writes Python ints)
serde_json = { workspace = true, features = ["arbitrary_precision"] }
base64.workspace = true
getrandom = "0.2"
indexmap = "2"
ureq = { workspace = true, optional = true }
tiny_http = { workspace = true, optional = true }

# the hub service (B1 `python -m xbt402.hub --config hub.json`); the library needs none of these
[[bin]]
name = "xbt402-hub"
required-features = ["rpc", "http-client", "http-server"]
