[package]
name = "xbt402"
description = "xbt402: the shared wire of paid HTTP on XBT (x402 v2 headers, request binding), the stream-ticket and lottery wires, and the scheme seam pay with work plugs into"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# blocking HTTP client transport (ureq) for the payer
http-client = ["dep:ureq"]
# std::net server around a service (header cap, read deadlines, connection limit)
http-server = ["dep:xbt-svc"]
# bitcoind JSON-RPC client (ureq)
rpc = ["dep:ureq"]

[dependencies]
xbt-primitives.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
getrandom = "0.2"
ureq = { workspace = true, optional = true }
xbt-svc = { workspace = true, optional = true }

[dev-dependencies]
# AGP-105: the parser ureq hands a URL to, to test `wire::sendable_url` against (already in the tree)
url = "2.5"

[[test]]
name = "tokens_live"
required-features = ["http-client"]

[[test]]
name = "http_limits"
required-features = ["http-client", "http-server"]
