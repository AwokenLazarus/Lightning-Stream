[package]
name = "xbt-nwc"
description = "The Lightning Stream app as a Nostr Wallet Connect (NIP-47) wallet service: other apps pay through the owner's node, under the owner's policy, through the wallet's signer, holding no wallet keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# the signer's socket client, its BOLT 11 decoder (feature bit 512) and its socket protocol, reused
xbt-signer.workspace = true
xbt-svc.workspace = true
# events, NIP-44 v2, the WebSocket and the relay pool
xbt-nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
secp256k1.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
