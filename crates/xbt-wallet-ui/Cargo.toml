[package]
name = "xbt-wallet-ui"
description = "The agent wallet's web UI for boxes with no terminal (Umbrel, StartOS): policy, human approvals, channels, refunds, signature log, anchor status, and Lightning Stream browse, player and connections (AGP-039)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Server-rendered HTML over the signer's socket. No xbt-signer dependency on purpose: the UI never
# links the key-handling code, and stays small (serde_json, scrypt for the login hash, ed25519-dalek for the offline `sign` helper; HTTP is xbt-svc's std-only server).
[dependencies]
serde_json.workspace = true
hex.workspace = true
getrandom = "0.2"
scrypt = { version = "0.11", default-features = false }
sha2.workspace = true
# AGP-042: the atomic, never-world-readable write of the rotated MCP token; AGP-072: the bounded HTTP server (std only)
xbt-svc.workspace = true
# only for `xbt-wallet-ui sign` (a human signing on another device); the server never signs
ed25519-dalek = "2.1"
# the setup pages: the gateway's own config parser and macaroon check judge what the gateway page writes,
# and its mainnet warning is shown from the gateway itself (a workspace crate; no new third-party crate)
xbt-gateway = { path = "../xbt-gateway" }
# a macaroon pasted as base64 (already in the tree through the gateway and the signer)
base64.workspace = true
# the player's video, relayed from the connector on loopback (the tree's own HTTP client, already used by the gateway)
ureq.workspace = true
# Browse's Nostr page: the relay query and the listing checks
xbt-nostr.workspace = true
# the Services page and the Nostr page check a seller's signed listing (already in the tree through the gateway)
xbt402.workspace = true

[dev-dependencies]
tempfile = "3"
xbt-signer.workspace = true
xbt-wallet-mcp = { path = "../xbt-wallet-mcp" }
# the Connected apps page against the NWC service's real admin socket
xbt-nwc = { path = "../xbt-nwc" }
xbt402 = { workspace = true, features = ["http-client", "http-server"] }
xbt-primitives.workspace = true
# a TLS node for the certificate-pinning test (the gateway's own version and features)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
