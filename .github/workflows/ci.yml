# Build, test and lint the workspace on every push and pull request.
#
# What this runs: the unit and integration suites of the workspace. They need no Lightning node,
# no chain node and no Docker: the tests use stand-in nodes in process. Two tests of the wallet's
# web UI (crates/xbt-wallet-ui/tests/browser.rs and crypto_js.rs) drive node and headless Chrome
# and print "skipped" when they find none; the Chrome step below installs one and passes its path
# in CHROME, and under CI (the CI variable) a missing browser fails the test instead of skipping.
#
# What this does not run: the regtest lab scripts under scripts/ (they need Docker and build a
# Lightning Fork lab) and the cross builds. Their latest reports are in reports/.
#
# The toolchain is pinned to the version these four steps were last run on by hand. The minimum
# Cargo.toml states is 1.90 (a locked dependency, ruint 1.20.1, declares it); clippy is clean on
# 1.91.1 and on 1.98.0.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  workspace:
    name: build, test, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      # every crate comes from crates.io at the version and checksum Cargo.lock names, but for
      # ureq, which is the patched copy under vendor/ureq
      - name: Fetch the dependencies Cargo.lock names
        run: cargo fetch --locked
      - name: Build
        run: cargo build --workspace --locked
      # a test binary that hangs is ended by its watchdog (crates/xbt-signer/tests/common/mod.rs,
      # XBT_TEST_HANG_SECS), which first prints every thread's stack with gdb: gdb on the PATH, and
      # a process may be traced by its own child
      - name: Let a hung test print its threads' stacks
        run: |
          command -v gdb || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gdb; }
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Install Chrome for the wallet UI browser test
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Licences, banned crates and sources (deny.toml). The advisory check is left out on purpose:
  # it reads a database that changes every day, so it can fail a push that changed nothing. Run
  # `cargo deny check` by hand for it; it cannot see advisories for the vendored ureq.
  deny:
    name: cargo deny (licences, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Check licences, bans and sources
        run: cargo deny check licenses bans sources
